name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web (lint / typecheck / test / build / smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke

  tauri:
    name: Tauri (Rust check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: pnpm build
      - name: cargo check
        working-directory: apps/app/src-tauri
        run: cargo check
      - name: cargo test
        working-directory: apps/app/src-tauri
        run: cargo test --lib
      - name: cargo clippy
        working-directory: apps/app/src-tauri
        # Reporting-only for now; flip to `-D warnings` once a clean
        # baseline is confirmed on all targets.
        run: cargo clippy --all-targets

  vendor-drift:
    name: Vendored tauri-runtime-wry matches crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff vendor tree against upstream 2.11.4
        run: |
          curl -sSfL https://crates.io/api/v1/crates/tauri-runtime-wry/2.11.4/download -o /tmp/upstream.crate
          mkdir -p /tmp/upstream
          tar -xzf /tmp/upstream.crate -C /tmp/upstream
          diff -ru /tmp/upstream/tauri-runtime-wry-2.11.4 apps/app/src-tauri/vendor/tauri-runtime-wry --exclude Cargo.toml
