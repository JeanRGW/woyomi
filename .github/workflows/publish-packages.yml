name: publish packages

on:
  push:
    tags:
      - 'packages-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm (@woyomi/core + @woyomi/plugin-builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Publish each package only when its exact version is not already on npm.
      # pnpm publish rewrites workspace:* dependencies to real versions.
      - name: Publish unpublished package versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package_dir in packages/core packages/plugin-builder; do
            package_name=$(node -p "JSON.parse(require('fs').readFileSync('$package_dir/package.json', 'utf8')).name")
            package_version=$(node -p "JSON.parse(require('fs').readFileSync('$package_dir/package.json', 'utf8')).version")
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "Skipping already published $package_name@$package_version"
            else
              pnpm --filter "$package_name" publish --access public --no-git-checks
            fi
          done
