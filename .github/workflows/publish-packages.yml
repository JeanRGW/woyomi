name: publish packages

on:
  push:
    tags:
      - 'packages-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm (@woyomi/core + @woyomi/plugin-builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # pnpm publish (not npm publish) rewrites workspace:* deps to real versions
      - run: pnpm --filter @woyomi/core --filter @woyomi/plugin-builder publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
