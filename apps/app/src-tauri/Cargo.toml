[package]
name = "woyomi"
version = "0.1.0"
description = "Multi-source content aggregator (Aniyomi/Mihon-style)"
authors = ["jeanrgw"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "woyomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
sha2 = "0.10"
http = "1"
url = "2"
tiny_http = "0.12"

# HACK(patch): Use wry 0.56.1 on Windows (fixes a Windows WebView2 crash on
# resize/maximize, wry#1794) while retaining wry 0.55.x on Android and other
# targets until a released tauri-runtime-wry supports the newer Android JNI API.
# Remove once a released tauri-runtime-wry supports wry >= 0.56.1 everywhere.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
